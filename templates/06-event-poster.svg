  </g>
  <text x="540" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="14" fill="#F7B267">FRIDAY · 21:00</text>
  <text x="540" y="1010" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="140" fill="#F4F1DE">VINYL</text>
