    <text x="110" y="315" font-size="20" font-weight="700">Buttermilk Pancakes</text>
    <text x="706" y="315" text-anchor="end" font-size="20" font-weight="700">12</text>
    <text x="110" y="340" font-size="14" fill="#7A6656">maple syrup, berries, whipped butter</text>
