    <text x="706" y="455" text-anchor="end" font-size="20" font-weight="700">9</text>
    <text x="110" y="480" font-size="14" fill="#7A6656">greek yogurt, honey, seasonal fruit</text>
    <text x="408" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#7A4E2D">— Lunch —</text>
    <text x="110" y="625" font-size="20" font-weight="700">Roasted Tomato Soup</text>
