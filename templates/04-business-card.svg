<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 680" width="1140" height="680">
  <title>Architecture Studio — Business Card (front and back)</title>
  <rect width="1140" height="680" fill="#EFEDE7"/>
  <g>
    <rect x="40" y="170" width="540" height="320" fill="#1F3D33"/>
    <g transform="translate(310,300)" fill="none" stroke="#D8C9A3" stroke-width="3">
      <rect x="-46" y="-46" width="92" height="92"/>
      <rect x="-18" y="-18" width="36" height="36" fill="#D8C9A3" stroke="none"/>
      <line x1="-46" y1="0" x2="-70" y2="0"/>
      <line x1="46" y1="0" x2="70" y2="0"/>
      <line x1="0" y1="-46" x2="0" y2="-70"/>
      <line x1="0" y1="46" x2="0" y2="70"/>
    </g>
    <text x="310" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="8" fill="#EFEDE7">ATELIER</text>
  </g>
  <g>
    <rect x="560" y="170" width="540" height="320" fill="#FBFAF6"/>
    <rect x="560" y="170" width="540" height="320" fill="none" stroke="#DDD8CB" stroke-width="2"/>
    <g font-family="Arial, sans-serif">
      <text x="600" y="240" font-family="Georgia, serif" font-size="34" fill="#1F3D33">Your Name</text>
      <text x="600" y="268" font-size="12" letter-spacing="4" fill="#9A8F72">PRINCIPAL ARCHITECT</text>
      <line x1="600" y1="292" x2="1060" y2="292" stroke="#1F3D33" stroke-width="1" opacity="0.35"/>
      <g font-size="13" fill="#4A4A44">
        <text x="600" y="328">+00 000 000 000</text>
        <text x="600" y="352">you@example.com</text>
        <text x="600" y="376">123 Street Name, City</text>
        <text x="600" y="400">www.example.com</text>
      </g>
      <text x="600" y="462" font-size="10" letter-spacing="3" fill="#9A8F72">DESIGN · BUILD · RESTORE</text>
    </g>
  </g>
</svg>
